name: build-test-push

on:
  workflow_call:
    inputs:
      image:
        required: true
        type: string
      dockerfile:
        required: true
        type: string
      cache_scope:
        required: true
        type: string
      extra_tags:
        required: false
        type: string
        default: ''

jobs:
  build-test-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v6
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        uses: docker/metadata-action@v6
        id: meta
        with:
          images: ghcr.io/${{ github.repository_owner }}/${{ inputs.image }}
          tags: |
            type=ref,event=branch
            type=sha
            type=raw,value=latest,enable={{is_default_branch}}
            ${{ inputs.extra_tags }}

      - name: Build local test image
        uses: docker/build-push-action@v7
        with:
          file: ${{ inputs.dockerfile }}
          load: true
          tags: ${{ inputs.image }}:ci
          cache-from: type=gha,scope=${{ inputs.cache_scope }}

      - name: Install Trivy CLI
        uses: aquasecurity/setup-trivy@v0.3.1

      - name: Run image-specific tests and Trivy gate
        run: ./tests/run.sh ${{ inputs.image }} --skip-build --tag ${{ inputs.image }}:ci

      - name: Upload Trivy report
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: trivy-report-${{ inputs.image }}
          path: test-results/trivy-${{ inputs.image }}_ci.txt
          archive: false

      - name: Build and push multi-arch image
        id: push
        uses: docker/build-push-action@v7
        with:
          file: ${{ inputs.dockerfile }}
          platforms: linux/amd64,linux/arm64
          push: true
          provenance: false
          sbom: false
          cache-from: type=gha,scope=${{ inputs.cache_scope }}
          cache-to: type=gha,mode=max,scope=${{ inputs.cache_scope }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
