name: images

on:
  workflow_dispatch:
    inputs:
      no_cache:
        description: 'Build without cache'
        required: false
        type: boolean
        default: false
  push:
    branches:
      - main
    paths:
      - '*.Dockerfile'
      - 'tests/**'
      - 'test.sh'
      - '.github/workflows/**'
  schedule:
    - cron: '0 0 * * 2'

jobs:
  base:
    uses: $/.github/workflows/_build-test-push.yaml
    with:
      image: base
      dockerfile: base.Dockerfile
      cache_scope: base
      no_cache: ${{ inputs.no_cache || github.event_name == 'schedule' }}

  node:
    uses: $/.github/workflows/_build-test-push.yaml
    needs: base
    with:
      image: node
      dockerfile: node.Dockerfile
      cache_scope: node
      no_cache: ${{ inputs.no_cache || github.event_name == 'schedule' }}
      extra_tags: |
        type=raw,value=24,enable={{is_default_branch}}

  universal:
    uses: $/.github/workflows/_build-test-push.yaml
    needs: base
    with:
      image: universal
      dockerfile: universal.Dockerfile
      cache_scope: universal
      no_cache: ${{ inputs.no_cache || github.event_name == 'schedule' }}
