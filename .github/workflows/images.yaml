name: images

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'base.Dockerfile'
      - 'node.Dockerfile'
      - 'universal.Dockerfile'
      - 'tests/**'
      - 'test.sh'
      - '.github/workflows/images.yaml'
  schedule:
    - cron: '0 0 * * 2'

jobs:
  build-test-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: base
            dockerfile: base.Dockerfile
            cache_scope: base
            extra_tags: ''
          - image: node
            dockerfile: node.Dockerfile
            cache_scope: node
            extra_tags: |
              type=raw,value=24,enable={{is_default_branch}}
          - image: universal
            dockerfile: universal.Dockerfile
            cache_scope: universal
            extra_tags: ''

    steps:
      - uses: actions/checkout@v6
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        uses: docker/metadata-action@v6
        id: meta
        with:
          images: ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}
          tags: |
            type=ref,event=branch
            type=sha
            type=raw,value=latest,enable={{is_default_branch}}
            ${{ matrix.extra_tags }}

      - name: Build local test image
        uses: docker/build-push-action@v7
        with:
          file: ${{ matrix.dockerfile }}
          load: true
          tags: ${{ matrix.image }}:ci
          cache-from: type=gha,scope=${{ matrix.cache_scope }}

      - name: Install Trivy CLI
        uses: aquasecurity/setup-trivy@v0.3.1

      - name: Run image-specific tests and Trivy gate
        run: ./tests/run.sh ${{ matrix.image }} --skip-build --tag ${{ matrix.image }}:ci

      - name: Upload Trivy report
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: trivy-report-${{ matrix.image }}
          path: test-results/trivy-*.txt

      - name: Build and push multi-arch image
        id: push
        uses: docker/build-push-action@v7
        with:
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64,linux/arm64
          push: true
          provenance: false
          sbom: false
          cache-from: type=gha,scope=${{ matrix.cache_scope }}
          cache-to: type=gha,mode=max,scope=${{ matrix.cache_scope }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
