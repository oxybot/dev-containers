name: typescript-node

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'typescript-node.Dockerfile'
      - '.github/workflows/typescript-node.yaml'
  schedule:
    - cron: '0 1 * * 2'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/typescript-node

    steps:
      - uses: actions/checkout@v6
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        uses: docker/metadata-action@v6
        id: meta
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=sha
            type=raw,value=latest,enable={{is_default_branch}}
            type=raw,value=24,enable={{is_default_branch}}

      - name: Build and push multi-arch image
        id: push
        uses: docker/build-push-action@v7
        with:
          file: typescript-node.Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          provenance: false
          sbom: false
          cache-from: type=gha,scope=typescript-node
          cache-to: type=gha,mode=max,scope=typescript-node
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Run Trivy vulnerability scanner (txt report)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.IMAGE_NAME }}@${{ steps.push.outputs.digest }}
          format: table
          output: trivy-report.txt
          severity: HIGH,CRITICAL
          ignore-unfixed: true

      - name: Upload Trivy report (txt)
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: trivy-report-table
          path: trivy-report.txt

      - name: Run Trivy vulnerability scanner (json report)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.IMAGE_NAME }}@${{ steps.push.outputs.digest }}
          format: json
          output: trivy-report.json
          severity: HIGH,CRITICAL
          ignore-unfixed: true

      - name: Upload Trivy report (json)
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: trivy-report-json
          path: trivy-report.json
